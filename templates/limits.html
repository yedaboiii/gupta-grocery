<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Credit Limits - Swaraj Grocery</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans p-4 md:p-6">
    {{ admin_navbar | safe }}
    <div class="max-w-6xl mx-auto bg-white p-4 md:p-6 rounded-2xl shadow-md border border-slate-200">
        <h1 class="text-xl font-bold text-amber-700 mb-4">🛡️ Customer Credit & Khata Limits</h1>
        <form action="/khata_limits" method="POST" class="grid grid-cols-1 sm:grid-cols-4 gap-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200">
            <input type="text" name="name" placeholder="Customer Name" required class="p-2 border rounded-lg text-xs">
            <input type="text" name="phone" placeholder="10-digit Phone" required class="p-2 border rounded-lg text-xs">
            <input type="number" step="0.01" name="credit_limit" placeholder="Credit Limit (₹)" value="2000.00" required class="p-2 border rounded-lg text-xs">
            <button type="submit" class="bg-amber-600 text-white font-semibold rounded-xl hover:bg-amber-700 text-xs shadow">Save Limit</button>
        </form>
        <div class="overflow-x-auto">
            <table class="w-full border-collapse border border-slate-200 text-xs">
                <thead>
                    <tr class="bg-slate-200 text-left">
                        <th class="p-2.5 border">ID</th>
                        <th class="p-2.5 border">Customer Name</th>
                        <th class="p-2.5 border">Phone</th>
                        <th class="p-2.5 border">Credit Limit</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in customers %}
                    <tr>
                        <td class="p-2.5 border font-semibold">#{{ c[0] }}</td>
                        <td class="p-2.5 border font-medium">{{ c[1] }}</td>
                        <td class="p-2.5 border">{{ c[2] }}</td>
                        <td class="p-2.5 border font-bold text-amber-700">₹{{ "%.2f"|format(c[3] if c[3] is not none else 0.0) }}</td>
                    </tr>
                    {% else %}
                    <tr><td colspan="4" class="p-4 text-center text-slate-400">No credit limits configured.</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
